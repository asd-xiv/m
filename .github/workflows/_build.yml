name: Build
on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ inputs.cache-key }}

      - name: Build
        run: npm run build

      # Every later job of the run downloads this build, so lint, the API site
      # and npm get the same files
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
