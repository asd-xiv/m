name: Code QA
on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ inputs.cache-key }}

      # examples/ imports @asd14/m, which resolves to dist/
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run linting
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ inputs.cache-key }}

      - name: Run type checking
        run: npm run typecheck

  type-test:
    name: Type tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ inputs.cache-key }}

      - name: Run type tests
        run: npm run type-test

  # engines.node in package.json promises the Node LTS lines tested here
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ inputs.cache-key }}

      - name: Run unit tests with coverage
        run: npm run coverage
