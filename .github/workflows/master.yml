name: Release
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Detect Secrets
    uses: ./.github/workflows/_detect-secrets.yml

  install-dependencies:
    name: Install Dependencies
    uses: ./.github/workflows/_install-dependencies.yml

  code-qa:
    name: Code QA
    needs: [detect-secrets, install-dependencies]
    uses: ./.github/workflows/_code-qa.yml
    with:
      cache-key: ${{ needs.install-dependencies.outputs.cache-key }}

  pages:
    name: Deploy the API site
    needs: [code-qa]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Let a running deploy finish, a newer one waits for it
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ needs.install-dependencies.outputs.cache-key }}

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the API site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Release
    needs: [install-dependencies, code-qa]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Auth for git commands later in the job (commit, tag, push)
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ needs.install-dependencies.outputs.cache-key }}

      - name: Build
        run: npm run build

      - name: Release
        env:
          # Auth for GitHub REST API (create release, comment on issues/PRs)
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # Credit people, not @semantic-release/git's "semantic-release-bot".
          # The author wrote the last pushed commit, the committer pushed it
          GIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: npx semantic-release
